name: Release

# Push a version tag to build the extension and publish a GitHub Release:
#   git tag v2.0.7
#   git push origin v2.0.7
# The tag must match "version" in public/manifest.json.
#
# The release notes are the README.md section whose "## " heading contains
# the version (e.g. "## What's new in v2.0.7"), up to the next "## " heading.
# Installation instructions live in README.md, not in the release.
#
# To refresh an existing release (notes and zip), run this workflow manually
# from the Actions tab and enter the tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to (re)publish, e.g. v2.0.7"
        required: true

permissions:
  contents: write # create the release and upload the zip

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches manifest version
        id: version
        run: |
          TAG_VERSION="${TAG#v}"
          MANIFEST_VERSION="$(node -p "require('./public/manifest.json').version")"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from README
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v ver="v$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, ver)) { found = 1; next }
            }
            found
          ' README.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::README.md has no '## ... v$VERSION' section with the change summary"
            exit 1
          fi
          cat notes.md

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Build
        run: npm run build

      - name: Package
        run: |
          NAME="tabius-${{ steps.version.outputs.version }}"
          rm -rf "$NAME"
          cp -r dist "$NAME"
          zip -r "$NAME.zip" "$NAME"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Tabius $VERSION" --notes-file notes.md
            gh release upload "$TAG" "tabius-$VERSION.zip" --clobber
          else
            gh release create "$TAG" "tabius-$VERSION.zip" \
              --title "Tabius $VERSION" \
              --notes-file notes.md
          fi
